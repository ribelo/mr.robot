# The Windows installer of the Host app (v1.16 ticket 04, ob-szqb): pnpm --filter @mr-robot/host dist:win
# It packs dist/ (build.mjs --windows writes the bundle, DSH's two helper programs, koffi, the shell check and a package.json there) as the app.
# The installer is not signed: Windows SmartScreen warns on first run. Code signing and auto-update are not part of v1.16.
appId: ai.mr-robot.host
productName: Mr. Robot host
# An Electron 43 release, the line the Nix package wraps (nixpkgs has 43.7.7); electron-builder fetches the Windows build of it.
electronVersion: 43.7.11
directories:
  app: dist
  output: release
# No asar: DSH starts its helper programs and loads koffi from real files next to the bundle.
asar: false
npmRebuild: false
files:
  - "**/*"
  - "!**/*.map"
executableName: mr-robot-host
win:
  target:
    - target: nsis
      arch: x64
  # Editing the exe (icon, version) and signing need Wine on a non-Windows machine; neither is wanted yet.
  signAndEditExecutable: false
  artifactName: mr-robot-host-setup-${version}-${arch}.${ext}
nsis:
  # Per user, no administrator: the app lives in the profile of the person whose computer it opens to the Robots.
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
