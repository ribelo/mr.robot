<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'" />
<title>Mr. Robot</title>
<style>
  body { font: 15px system-ui, sans-serif; background: #1d1d1f; color: #eee; margin: 0; display: grid; place-items: center; height: 100vh; }
  form { width: min(440px, 90vw); }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: #aaa; margin: 0 0 18px; line-height: 1.45; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid #444; background: #2a2a2c; color: #eee; font: inherit; }
  button { margin-top: 14px; padding: 9px 16px; border-radius: 10px; border: 0; background: #eee; color: #111; font: inherit; cursor: pointer; }
  .error { color: #f99; margin-top: 10px; min-height: 1em; }
</style>
</head>
<body>
<form id="form">
  <h1>Mr. Robot</h1>
  <p>Enter the address of your Mr. Robot server. You sign in on the next screen with your e-mail code, as on the web.</p>
  <input id="server" type="text" placeholder="https://your-mr-robot.example" autocomplete="off" autofocus />
  <button type="submit">Continue</button>
  <div id="error" class="error"></div>
</form>
<script>
  document.getElementById('form').onsubmit = async (event) => {
    event.preventDefault()
    const result = await window.mrRobotHost.save({ server: document.getElementById('server').value })
    if (result && result.error) document.getElementById('error').textContent = result.error
  }
</script>
</body>
</html>
